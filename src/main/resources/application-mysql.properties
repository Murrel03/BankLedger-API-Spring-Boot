# MySQL profile — activate with: -Dspring-boot.run.profiles=mysql
# Adjust username/password (or set DB_USERNAME / DB_PASSWORD env vars).
spring.datasource.url=jdbc:mysql://localhost:3306/bankledger?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
