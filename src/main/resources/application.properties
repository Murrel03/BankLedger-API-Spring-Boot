spring.application.name=bankledger

# ---- Default database: H2 in-memory (no installation needed) ----
spring.datasource.url=jdbc:h2:mem:bankledger;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create tables from the JPA entities at startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead ----
# 1. Create a database:  CREATE DATABASE bankledger;
# 2. Start with the mysql profile:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#    (settings live in application-mysql.properties)
